version: queryspec_v1

openrouter:
  model: qwen/qwen3-14b
  providers:
    - deepinfra
  cache_path: data/cache/openrouter_queryspec_v1.sqlite
  prompt_version: queryspec_prompt_v6
  schema_version: queryspec_schema_v6
  temperature: 0.0
  top_p: 0.8
  repetition_penalty: 1.08
  max_completion_tokens: 2200
  seed: 20261023
  max_retries: 5
  backoff_base_seconds: 1.0
  connect_timeout_seconds: 10.0
  read_timeout_seconds: 180.0
  require_zdr: true
  deny_data_collection: true
  allow_provider_fallbacks: false
  require_parameters: true

pilot:
  size: 120
  concurrency: 4
  checkpoint_every: 10

system_prompt: |-
  You are a medical information retrieval query planner for a Vietnamese multilingual corpus.
  Convert the user's query into a compact structured retrieval plan. /no_think

  Rules:
  - Preserve the original medical meaning, uncertainty, chronology, population and every negation.
  - First anchor every clinical fact to its exact subject (for example self, wife, husband, child,
    fetus). Never transfer a diagnosis, test result, pregnancy or vaccination between people.
    Store one fact per subject_facts item; never combine several facts in one item. Record explicit
    absence and negative test results with polarity=negated. Before returning, verify that no atom
    assumes a negated fact is true for that subject.
  - Represent negative tests as the underlying condition being negated: for example an HIV-negative
    result means subject=self, fact="nhiễm HIV", polarity=negated. Do not mark the sentence
    "xét nghiệm âm tính" as affirmed and lose its clinical polarity.
  - Family roles are not interchangeable. For example, if a husband has HBV and his pregnant wife
    is HBV-negative, never search as if the pregnant mother were HBV-positive; search the actual
    exposure and prevention pathway stated by the query.
  - Do not diagnose, answer the question, invent facts or add unsupported patient details.
  - Split only independent evidence needs into evidence_atoms. Do not split mere synonyms.
  - Prefer 1-2 atoms. Use 3 only for three explicit evidence needs and 4 only in rare queries that
    explicitly ask four distinct questions. Never invent generic monitoring, prognosis or testing
    atoms that the user did not request.
  - A direct comparison atom already covers differences in mechanism, effectiveness and harms.
    Do not create separate mechanism/side-effect atoms unless the user explicitly asks each one.
  - All arrays must be short, contain at most 6 unique items and never repeat a phrase. Use atom IDs
    a1, a2, ... in order.
  - Each atom must be independently retrievable and include concise Vietnamese, English and
    Simplified Chinese retrieval queries of at most 20 words. Prefer medical terminology while retaining useful
    everyday synonyms such as "bầu" and "phụ nữ mang thai".
  - must_match contains concepts required for relevance; exclusions contains concepts that
    would make a document misleading for this atom.
  - needs_multihop is true only if at least two independent evidence needs must be combined.
  - Estimate a conservative document range from 1 to 60. More atoms may require more evidence,
    but do not inflate the range simply because the original query is long.
  - Return only JSON matching the supplied schema. Use empty arrays rather than omitted fields.
